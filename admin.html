<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Kuban Adventures</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        input, button, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.delete { background: #dc3545; width: auto; padding: 5px 10px; font-size: 0.9rem; }
        .item { background: #fff; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #auth-section, #admin-panel { display: none; }
        .error { color: red; font-size: 0.9rem; }
        .success { color: green; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Админ-панель Kuban Adventures</h1>
        
        <!-- Секция авторизации -->
        <div id="auth-section">
            <h2>Вход для администратора</h2>
            <input type="email" id="email" placeholder="Email" value="arsensal06@gmail.com">
            <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
            <button onclick="handleLogin()">Войти</button>
            <button onclick="handleRegister()" style="background:#28a745">Регистрация</button>
            <p id="auth-error" class="error"></p>
        </div>

        <!-- Панель управления -->
        <div id="admin-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>Управление контентом</h2>
                <button onclick="handleLogout()" style="width:auto; background:#6c757d;">Выйти</button>
            </div>
            
            <h3>Добавить тур / позицию</h3>
            <input type="text" id="item-title" placeholder="Название">
            <textarea id="item-desc" rows="3" placeholder="Описание"></textarea>
            <input type="number" id="item-price" placeholder="Цена (руб)">
            <input type="text" id="item-image" placeholder="Ссылка на изображение (URL)">
            <button onclick="addItem()">Добавить в базу</button>
            <p id="save-status"></p>

            <h3>Список элементов</h3>
            <div id="items-list">Загрузка...</div>
        </div>
    </div>

    <!-- Подключение Firebase (Compat версии для работы в браузере) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // КОНФИГУРАЦИЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDV7tI0bjAPQkcoqq8pnWmzREiEW3nngek",
            authDomain: "kubanadventures.firebaseapp.com",
            databaseURL: "https://kubanadventures-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kubanadventures",
            storageBucket: "kubanadventures.firebasestorage.app",
            messagingSenderId: "229875586028",
            appId: "1:229875586028:web:cbd60292ff45d21d9166c9"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Элементы UI
        const authSection = document.getElementById('auth-section');
        const adminPanel = document.getElementById('admin-panel');
        const itemsList = document.getElementById('items-list');
        const statusMsg = document.getElementById('save-status');

        // Слушатель состояния входа
        auth.onAuthStateChanged(user => {
            if (user) {
                authSection.style.display = 'none';
                adminPanel.style.display = 'block';
                loadItems();
            } else {
                authSection.style.display = 'block';
                adminPanel.style.display = 'none';
            }
        });

        // Вход
        function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass)
                .catch(err => document.getElementById('auth-error').innerText = "Ошибка: " + err.message);
        }

        // Регистрация
        function handleRegister() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => alert("Пользователь создан! Теперь войдите."))
                .catch(err => document.getElementById('auth-error').innerText = "Ошибка: " + err.message);
        }

        // Выход
        function handleLogout() {
            auth.signOut();
        }

        // Добавление элемента
        function addItem() {
            const title = document.getElementById('item-title').value;
            const desc = document.getElementById('item-desc').value;
            const price = document.getElementById('item-price').value;
            const image = document.getElementById('item-image').value;

            if (!title || !price) return alert("Заполните название и цену");

            const newItem = { title, description: desc, price: Number(price), image: image || '', createdAt: Date.now() };
            
            // Сохранение в Realtime Database
            db.ref('items').push(newItem)
                .then(() => {
                    statusMsg.innerText = "✅ Сохранено!";
                    statusMsg.className = "success";
                    // Очистка полей
                    document.getElementById('item-title').value = '';
                    document.getElementById('item-desc').value = '';
                    document.getElementById('item-price').value = '';
                    document.getElementById('item-image').value = '';
                    setTimeout(() => statusMsg.innerText = "", 2000);
                })
                .catch(err => {
                    statusMsg.innerText = "❌ Ошибка: " + err.message;
                    statusMsg.className = "error";
                });
        }

        // Загрузка и отображение списка (Realtime обновление)
        function loadItems() {
            db.ref('items').on('value', snapshot => {
                itemsList.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    itemsList.innerHTML = '<p>Список пуст</p>';
                    return;
                }
                
                Object.entries(data).forEach(([key, item]) => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div>
                            <strong>${item.title}</strong> - ${item.price} руб.<br>
                            <small>${item.description || ''}</small>
                        </div>
                        <button class="delete" onclick="deleteItem('${key}')">Удалить</button>
                    `;
                    itemsList.appendChild(div);
                });
            });
        }

        // Удаление элемента
        window.deleteItem = function(key) {
            if(confirm('Удалить этот элемент?')) {
                db.ref('items/' + key).remove();
            }
        };
    </script>
</body>
</html>
