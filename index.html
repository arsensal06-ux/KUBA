<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuban Adventures - Туры</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .card-price { color: #28a745; font-weight: bold; font-size: 1.1rem; }
        .card-desc { color: #666; font-size: 0.9rem; margin-top: 10px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏔️ Kuban Adventures</h1>
        <div id="tours-grid" class="grid">
            <div class="loading">Загрузка туров...</div>
        </div>
    </div>

    <!-- Подключение Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDV7tI0bjAPQkcoqq8pnWmzREiEW3nngek",
            authDomain: "kubanadventures.firebaseapp.com",
            databaseURL: "https://kubanadventures-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kubanadventures",
            storageBucket: "kubanadventures.firebasestorage.app",
            messagingSenderId: "229875586028",
            appId: "1:229875586028:web:cbd60292ff45d21d9166c9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const grid = document.getElementById('tours-grid');

        // Получение данных в реальном времени
        db.ref('items').on('value', snapshot => {
            grid.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                grid.innerHTML = '<div class="loading">Пока нет доступных туров.</div>';
                return;
            }

            Object.values(data).forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const imgUrl = item.image || 'https://via.placeholder.com/300x200?text=No+Image';
                
                card.innerHTML = `
                    <img src="${imgUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x200?text=Error'">
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-price">${item.price} ₽</div>
                        <div class="card-desc">${item.description || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
